# Builds VTL Core on every push and pull request, runs the self-checks and the protocol check
# against the mock server, and keeps the jar as a download on the run's page.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and run the self-checks
        run: |
          chmod +x gradlew
          ./gradlew build hubStateCheck configCheck queueTuningCheck --no-daemon

      - name: Protocol check against the mock server
        run: |
          npm --prefix 111/mock-server ci
          node 111/mock-server/mock-queue-server.js > mock.log 2>&1 &
          sleep 3
          ./gradlew queueProtocolCheck --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VTL-Core
          path: build/libs/VTL-Core+mc*.jar
          if-no-files-found: error
