# Pushing a tag like v3.3.0 builds VTL Core and publishes a GitHub Release with the jar attached.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and run the self-checks
        run: |
          chmod +x gradlew
          ./gradlew build hubStateCheck configCheck queueTuningCheck --no-daemon

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: VTL Core ${{ github.ref_name }}
          files: build/libs/VTL-Core+mc*.jar
          generate_release_notes: true
