# Pushing a tag like v1.0.0 builds VTL Core for every Minecraft version and publishes a GitHub Release
# with the six jars attached.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build every Minecraft version and run the self-checks
        run: |
          chmod +x gradlew
          ./gradlew chiseledBuild :1.21.11:hubStateCheck :1.21.11:configCheck :1.21.11:queueTuningCheck --no-daemon

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: VTL Core ${{ github.ref_name }}
          files: build/libs/*/VTL-Core+mc*.jar
          generate_release_notes: true
